[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crochet-core"
version = "0.1.0"
description = "Made-to-measure mushroom-dress crochet pattern engine and CLI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mushroom-dress = "crochet_cli:main"
mushroom-dress-web = "serve:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
py-modules = ["crochet_core", "crochet_cli", "crochet_viz", "serve"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
