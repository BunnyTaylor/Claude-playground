# Tests run on every push and pull request; the live GitHub Pages site is only
# ever deployed from main/master (or a manual run) — never from a pull request.
#
# One-time setup: repo Settings → Pages → Source → "GitHub Actions".
# The site then lives at https://<user>.github.io/<repo>/ and redeploys on
# every push to main.

name: Test & Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Least privilege by default; the deploy job opts into the Pages permissions.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test

  preview:
    # For every PR, build the self-contained single-file site and attach it to
    # the run as an artifact — a downloadable snapshot of the site at that PR,
    # for the record. A sticky comment links to it.
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build-artifact.mjs
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-pr${{ github.event.pull_request.number }}
          path: dist/artifact.html
          if-no-files-found: error
      - name: Comment the preview link on the PR
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- site-preview -->';
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const body = [
              marker,
              '### 🍄 Site preview (self-contained)',
              "A single-file build of this PR's site is attached to the workflow run — download it and open in any browser (works offline, no server needed).",
              '',
              `**[⬇︎ Download \`artifact.html\`](${process.env.ARTIFACT_URL})** · commit \`${sha}\``,
              '',
              "_Open the run's “Artifacts” section, download the zip, then open the `.html` inside._",
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number, body,
              });
            }

  deploy:
    # Never deploy from a pull request — this keeps PRs from touching the live
    # site. Only a push to main/master (or a manual dispatch) publishes.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialise deploys; let an in-flight publish finish rather than cancel it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
